<!DOCTYPE html>
<html th:replace="~{layout/kth/layout_main_kth :: layout(~{::title}, ~{::link}, ~{::style}, ~{::script}, ~{::div.container})}" 
      lang="ko" 
      xmlns:th="http://www.thymeleaf.org">
<!-- 타임리프는 백엔드 서버에서 HTML을 동적으로 렌더링하는 용도로 사용된다. -->

<head>
<meta charset="UTF-8">
<title>한식맛ZIP</title>

<!--/* Bootstrap CSS */--> 
<!-- <link rel="stylesheet" type="text/css" th:href="@{/bootstrap-5.3.8-dist/css/bootstrap.min.css}"> -->

<!--/* Optional JavaScript */-->
<!-- <script type="text/javascript" th:src="@{/js/jquery-4.0.0.js}"></script>
  
<script type="text/javascript" th:src="@{/bootstrap-5.3.8-dist/js/bootstrap.bundle.min.js}"></script> -->

<!--/* 커스텀 css */-->
<link rel="stylesheet" type="text/css" th:href="@{/css/kimkc/recipe/knowhow.css}"> 

<style type="text/css">
    
</style>

<script th:inline="javascript">
/*<![CDATA[*/
	$(function(){
		// 추후 노하우 목록 및 페이지바 동적 로딩 처리
	});
/*]]>*/   
</script>

</head>
<body>
    <div class="container my-5">
    
    	<!--/* 상단 타이틀 */-->
	    <h3 class="fw-bold mb-3">노하우</h3>
    	<hr class="mb-4">
	    	
    	<!--/* 노하우 카드 리스트 영역 */-->
	    <div class="recipe-wrap">
	    	<div id="knowhow-list" class="row row-cols-1 row-cols-sm-2 row-cols-md-4 g-4">
   				
   				<!--/* 노하우가 없다면 */--> 
   				<th:block th:if="${knowhowDtoList} == null">
   					작성된 노하우가 없습니다.
   				</th:block>
   				
   				
   				<!--/* 노하우가 있다면 */--> 
   				<th:block th:if="${knowhowDtoList} != null">
   				
	   				<!--/* 카드 1개 샘플 */-->
	   				<div class="col" th:each="knowhow : ${knowhowDtoList}">
	   					<div class="recipe-content">
	   						<div class="recipe-thumb mb-2">
	   							<!--/* 이미지 없을 때 회색 배경 */-->
	   							<img src="" alt="" onerror="this.style.display='none'"/>
	   						</div>
	   						
	   						<div class="recipe-caption px-1">
	   							<div class="recipe-caption-title fw-bold mb-2 text-truncate">
	   								<a href="#" class="text-decoration-none text-dark"
	   											th:text="${knowhow.r_subject}">요리 제목</a>
	   							</div>
	   							
	   							<div class="recipe-caption-writer mb-2">
	   								<a href="#" class="d-flex align-items-center gap-2 text-decoration-none text-secondary small">
	   									<img class="writer-avatar" src="" alt="" onerror="this.style.visibility='hidden'"/>
	   									<span th:text=${knowhow.nickname}>작성자 닉네임</span>
	   								</a>
	   							</div>
	   							
	   							<div class="recipe-caption-rating small">
	   								조회수&nbsp;<span class="view-cnt text-muted" th:text="${knowhow.r_views}"> 100</span>
	   							</div>
	   						</div>
	   					</div>
	   				</div>
	   				<!--/* 카드 1개 샘플 끝 */-->
	   				
   				</th:block>
   				
   			</div>
	    </div>
	    
	    <!--/* 페이지바 동적 생성 공간 */-->
	    <nav aria-label="Page navigation" class="my-5">
	    	<div id="pageBar" class="d-flex justify-content-center">
				<div th:utext="${pageBar}"></div>
	    	</div>
	    </nav>
    
    </div>
</body>
</html>
