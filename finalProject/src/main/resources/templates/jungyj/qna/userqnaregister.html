<!DOCTYPE html>
<html  lang="ko"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>1:1 문의 작성 - 한식맛ZIP</title>
    <link rel="stylesheet" href="">


<!--/* Bootstrap CSS */--> 
<link rel="stylesheet" type="text/css" th:href="@{/bootstrap-5.3.8-dist/css/bootstrap.min.css}">

<!--/* Font Awesome 6 Icons */-->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

<!-- /* 초기화 CSS */ -->
<link rel="stylesheet" th:href="@{/css/reset.css}">

<!--/* Optional JavaScript */-->
<script type="text/javascript" th:src="@{/js/jquery-4.0.0.js}"></script>
  
<script type="text/javascript" th:src="@{/bootstrap-5.3.8-dist/js/bootstrap.bundle.min.js}"></script>
<link rel="stylesheet" type="text/css" th:href="@{/css/jungyj/qna/userQna.css}">
    <style type="text/css"></style>

    <script th:inline="javascript">
        $(function () {
            const $subject = $('input[name="qna_subject"]');
            const $content = $('textarea[name="qna_content"]');
            const $fileInput = $('#file_1');
            const $previewImg = $('#previewImg');
            const $placeholder = $('#uploadPlaceholder');
            const $btnRemove = $('#btnRemoveImg');

            const MAX_FILES = 2;
            const MAX_SIZE = 5 * 1024 * 1024; // 5MB
            const ALLOWED_TYPES = ['image/jpg', 'image/png'];

            const $uploadBox = $('#uploadBox');
            const $previewContainer = $('#previewContainer');
            
            // 제목/내용 글자 수 실시간 카운트
            $subject.on('input', function () {
                $('#subjectCount').text($(this).val().length);
            });
            $content.on('input', function () {
                $('#contentCount').text($(this).val().length);
            });


            let selectedFiles = [];

            // 사진 추가 박스 클릭
            $uploadBox.on('click', function () {
                if (selectedFiles.length >= MAX_FILES) {
                    alert('사진은 최대 2장까지 첨부할 수 있습니다.');
                    return;
                }
                $fileInput.trigger('click');
            });

            // 파일 선택 시 검증 및 추가
            $fileInput.on('change', function () {
                const incomingFiles = Array.from(this.files);

                for (const file of incomingFiles) {
                    if (selectedFiles.length >= MAX_FILES) {
                        alert('사진은 최대 2장까지만 등록할 수 있습니다.');
                        break;
                    }
                    if (!ALLOWED_TYPES.includes(file.type)) {
                        alert('JPG, PNG 이미지 파일만 첨부할 수 있습니다.');
                        continue;
                    }
                    if (file.size > MAX_SIZE) {
                        alert('이미지 크기는 장당 최대 5MB까지 첨부 가능합니다.');
                        continue;
                    }
                    selectedFiles.push(file);
                }

                syncFileInput();
                renderPreviews();
            });

            // 개별 미리보기 삭제
            $previewContainer.on('click', '.btn-remove-img', function () {
                const index = Number($(this).data('index'));
                selectedFiles.splice(index, 1);
                syncFileInput();
                renderPreviews();
            });

            // selectedFiles 배열을 실제 input[type=file]에 동기화
            function syncFileInput() {
                const dataTransfer = new DataTransfer();
                selectedFiles.forEach(file => dataTransfer.items.add(file));
                $fileInput[0].files = dataTransfer.files;
            }

            // 옆에 최대 2개까지 미리보기 렌더링
            function renderPreviews() {
                $previewContainer.empty();
                $('#fileCount').text(selectedFiles.length);
                $uploadBox.toggleClass('is-full', selectedFiles.length >= MAX_FILES);

                selectedFiles.forEach((file, index) => {
                    const reader = new FileReader();
                    reader.onload = function (e) {
                        const html = `
                            <div class="preview-item">
                                <img src="${e.target.result}" alt="첨부 이미지 ${index + 1}" />
                                <button type="button" class="btn-remove-img" data-index="${index}" title="이미지 삭제">
                                    <i class="fa-solid fa-xmark"></i>
                                </button>
                            </div>
                        `;
                        $previewContainer.append(html);
                    };
                    reader.readAsDataURL(file);
                });
            }
        
        
            // 폼 제출 유효성 검사
            $('#myform').on('submit', function (e) {
                const subjectVal = $subject.val().trim();
                const contentVal = $content.val().trim();

                if (subjectVal.length === 0) {
                    alert('문의 제목을 입력해 주세요.');
                    $subject.focus();
                    e.preventDefault();
                    return false;
                }
                
                if (subjectVal.length < 5) {
                	alert("문의 제목은 5자 이상 입력해 주세요.");
                    $subject.focus();
                    e.preventDefault();
                    return false;
                }
                
                if (contentVal.length === 0) {
                    alert('문의 내용을 입력해 주세요.');
                    $content.focus();
                    e.preventDefault();
                    return false;
                }
                
                if (contentVal.length < 0) {
                    alert('문의 내용은 5자 이상 입력해 주세요.');
                    $content.focus();
                    e.preventDefault();
                    return false;
                }

                if (!confirm('문의사항을 등록하시겠습니까?')) {
                    e.preventDefault();
                    return false;
                }
            });

            // 취소 버튼
            $('#btnCancel').on('click', function () {
                if ($subject.val().trim() || $content.val().trim()) {
                    if (!confirm('작성 중인 내용이 사라집니다. 목록으로 돌아가시겠습니까?')) {
                        return;
                    }
                }
                location.href = /*[[@{/qna/list}]]*/ '';
            });
            
        }); // end of $(function(){})------------------------------------
    </script>
</head>

<body>
    <div class="container">
        <div class="row g-4">
            <!-- 좌측: 문의 작성 폼 (#contents_area) -->
            <div id="contents_area">
                <div class="qna-card p-4 p-md-5">
                    <form name="myform" id="myform" method="post"
                          th:action="@{/qna/register}" enctype="multipart/form-data">

                        <!-- 제목 -->
                        <div class="mb-4">
                            <div class="d-flex justify-content-between align-items-center mb-2">
                                <label for="qna_subject" class="form-label fw-semibold mb-0">
                                    제목 <span class="text-danger">*</span>
                                </label>
                                <span class="text-muted small"><span id="subjectCount">0</span> / 50자</span>
                            </div>
                            <input type="text" id="qna_subject" name="qna_subject"
                                   class="form-control qna-input write_tit"
                                   maxlength="50"
                                   placeholder="문의 제목을 입력해 주세요. (최대 50자)">
                        </div>

                        <!-- 내용 -->
                        <div class="mb-4">
                            <div class="d-flex justify-content-between align-items-center mb-2">
                                <label for="qna_content" class="form-label fw-semibold mb-0">
                                    문의 내용 <span class="text-danger">*</span>
                                </label>
                                <span class="text-muted small"><span id="contentCount">0</span> / 500자</span>
                            </div>
                            <textarea id="qna_content" name="qna_content"
                                      class="form-control qna-textarea"
                                      maxlength="500"
                                      placeholder="문의하실 내용을 자세히 적어주시면 더 정확하게 안내해 드릴 수 있습니다. (최대 500자)"></textarea>
                        </div>

                        <!-- 이미지 첨부 -->
						<div class="mb-4">
						    <div class="d-flex justify-content-between align-items-center mb-2">
						        <label class="form-label fw-semibold mb-0">
						            사진 첨부 <span class="text-muted fw-normal small">(선택, 최대 2장 / 장당 5MB)</span>
						        </label>
						        <span class="text-muted small"><span id="fileCount">0</span> / 2장</span>
						    </div>
						
						    <input type="file" name="files" id="file_1" class="d-none" accept="image/*" multiple />
						
						    <div class="d-flex flex-wrap gap-3 align-items-start">
						        <!-- 고정 업로드 버튼 박스 -->
						        <div id="uploadBox" class="upload-box">
						            <div class="upload-placeholder">
						                <i class="fa-regular fa-image d-block"></i>
						                <span>사진 추가</span>
						            </div>
						        </div>
						
						        <!-- 선택한 이미지 미리보기가 최대 2개까지 옆에 추가되는 영역 -->
						        <div id="previewContainer" class="d-flex flex-wrap gap-3"></div>
						    </div>
						</div>
						
						
                        <!-- 하단 버튼 -->
                        <div class="d-flex justify-content-end gap-2 pt-3 border-top">
                            <button type="button" id="btnCancel" class="btn btn-outline-secondary btn-lg px-4 fs-6">취소</button>
                            <button type="submit" id="submit_btn" class="btn btn-navy btn-lg px-5 fs-6">문의 등록</button>
                        </div>
                    </form>
                </div>
            </div>

        </div>

    </div>
</body>
</html>
