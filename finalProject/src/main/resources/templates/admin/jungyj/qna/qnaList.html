<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<!-- 타임리프는 백엔드 서버에서 HTML을 동적으로 렌더링하는 용도로 사용된다. -->

<head>
    <meta charset="UTF-8">
    <title>관리자 - 문의사항 목록</title>
    <!--/* Bootstrap CSS */--> 
	<link rel="stylesheet" type="text/css" th:href="@{/bootstrap-5.3.8-dist/css/bootstrap.min.css}">
	
	<!-- /* 초기화 CSS */ -->
	<link rel="stylesheet" th:href="@{/css/reset.css}">
	<!-- 분리한 커스텀 CSS -->
    <link rel="stylesheet" type="text/css" th:href="@{/css/jungyj/qna/qna.css}">
    
	<script type="text/javascript" th:src="@{/bootstrap-5.3.8-dist/js/bootstrap.bundle.min.js}"></script>

</head>
<body>

<div class="container mt-5">
	<div class="qna-wrapper mx-auto">
		<div class="d-flex justify-content-end align-items-center gap-4 bg-light border rounded px-3 py-2 mb-3 small">
		    <div>
		        <span class="text-muted me-1">답변 완료</span>
		        <strong class="text-primary" id="completedCount" th:text="${pendingCount}">8</strong>건
		    </div>
		    <div class="vr"></div> <!-- Bootstrap 5 세로 구분선 -->
		    <div>
		        <span class="text-muted me-1">미답변</span>
		        <strong class="text-danger" id="pendingCount" th:text="${completedCount}">4</strong>건
		    </div>
		</div>
		
	    <!-- 1. 탭: 나중에 ?status=DONE / ?status=WAIT 같은 쿼리 파라미터로 분기하기 좋음 -->
	    <ul class="nav nav-tabs mb-3">
	        <li class="nav-item">
	            <a class="nav-link active" aria-current="page" href="#">답변 미완료</a>
	        </li>
	        <li class="nav-item">
	            <a class="nav-link" href="#">답변 완료</a>
	        </li>
	    </ul>
	
		<!-- ★ 탭과 아코디언 사이: 건수 요약 바 -->
		<!-- 목록이 비어있을 때 -->
		<div th:if="${#lists.isEmpty(qnaDtoList)}" class="text-center py-5 text-muted border rounded-3">
		    등록된 문의 내역이 없습니다.
		</div>
	
	    <!-- 3. 문의내역 아코디언 (나중에 th:each="item, stat : ${inquiryList}" 반복) -->
	    <div class="accordion" id="inquiryAccordion" th:if="${not #lists.isEmpty(qnaDtoList)}">
	
			<div class="accordion-item" th:each="item : ${qnaDtoList}">
			        <h2 class="accordion-header" th:id="'heading' + ${item.qnaseq}">
			            <button class="accordion-button collapsed" type="button"
			                    data-bs-toggle="collapse"
			                    th:data-bs-target="'#collapse' + ${item.qnaseq}"
			                    aria-expanded="false"
			                    th:aria-controls="'collapse' + ${item.qnaseq}">
			
			                <div class="row w-100 align-items-center me-3">
			                    <!-- 상태 뱃지 -->
			                    <div class="col-auto">
			                        <span class="badge rounded-pill"
			                              th:classappend="${#strings.isEmpty(item.answer)} ? 'bg-secondary' : 'bg-primary'"
			                              th:text="${#strings.isEmpty(item.answer)} ? '답변대기' : '답변완료'">
			                            답변대기
			                        </span>
			                    </div>
			
			                    <!-- 문의 제목 -->
			                    <div class="col text-truncate fw-bold" th:text="${item.qna_subject}">
			                        문의 제목
			                    </div>
			
			                    <!-- 작성자 (DTO에 이름 필드가 없다면 우선 회원번호 표시, 이름 필드 추가 시 교체) -->
			                    <div class="col-auto text-muted small" th:text="${item.nickname}">
			                        작성자명
			                    </div>
			
			                    <!-- 문의 일시 -->
			                    <div class="col-auto text-muted small"
			                         th:text="${#temporals.format(item.question_date, 'yyyy-MM-dd HH:mm')}">
			                        2026-11-18 14:30
			                    </div>
			                </div>
			            </button>
			        </h2>
			
			        <div th:id="'collapse' + ${item.qnaseq}"
			             class="accordion-collapse collapse"
			             th:aria-labelledby="'heading' + ${item.qnaseq}"
			             data-bs-parent="#inquiryAccordion">
			
			            <div class="accordion-body">
			                <!-- 문의 상세 내용 -->
			                <div class="mb-3">
			                    <p class="mb-0" style="white-space: pre-line;" th:text="${item.qna_content}">
			                        상세 문의 내용
			                    </p>
			                </div>
			
			                <hr>
			
			                <!-- 1) 답변 미완료 상태일 때: 관리자 답변 작성 폼 -->
			                <form th:if="${#strings.isEmpty(item.answer)}"
			                      th:action="@{/admin/qna/answer}" method="post">
			                    <input type="hidden" name="qnaseq" th:value="${item.qnaseq}">
			                    <div class="mb-2">
			                        <label th:for="'reply' + ${item.qnaseq}" class="form-label fw-semibold">관리자 답변</label>
			                        <textarea th:id="'reply' + ${item.qnaseq}" name="answer"
			                                  class="form-control" rows="3"
			                                  placeholder="답변 내용을 입력하세요." required></textarea>
			                    </div>
			                    <div class="d-flex justify-content-end gap-2">
			                        <button type="submit" class="btn btn-primary btn-sm">등록</button>
			                        <button type="reset" class="btn btn-outline-secondary btn-sm">취소</button>
			                    </div>
			                </form>
			
			                <!-- 2) 답변 완료 상태일 때: 등록된 답변 표시 -->
			                <div th:unless="${#strings.isEmpty(item.answer)}" class="bg-light p-3 rounded-3">
			                    <div class="d-flex justify-content-between align-items-center mb-2">
			                        <span class="fw-semibold text-primary small">관리자 답변</span>
			                        <span class="text-muted small"
			                              th:text="${#temporals.format(item.answer_date, 'yyyy-MM-dd HH:mm')}">
			                            2026-11-19 10:00
			                        </span>
			                    </div>
			                    <p class="mb-0" style="white-space: pre-line;" th:text="${item.answer}">
			                        답변 내용
			                    </p>
			                </div>
			
			            </div>
			        </div>
			    </div>


			    <!-- 4. 페이지네이션 -->
		    <nav class="mt-4" aria-label="문의사항 페이지네이션">
		        <ul class="pagination justify-content-center">
		            <li class="page-item disabled"><a class="page-link" href="#">이전</a></li>
		            <li class="page-item active"><a class="page-link" href="#">1</a></li>
		            <li class="page-item"><a class="page-link" href="#">2</a></li>
		            <li class="page-item"><a class="page-link" href="#">3</a></li>
		            <li class="page-item"><a class="page-link" href="#">다음</a></li>
		        </ul>
		    </nav>
	    </div>
	

	</div>
</div>	
	
</body>
</html>
