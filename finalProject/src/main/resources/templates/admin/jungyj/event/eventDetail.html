<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<!-- 타임리프는 백엔드 서버에서 HTML을 동적으로 렌더링하는 용도로 사용된다. -->

<head>
    <meta charset="UTF-8">
    <title>관리자 - 이벤트 상세페이지</title>
    <!--/* Bootstrap CSS */--> 
	<link rel="stylesheet" type="text/css" th:href="@{/bootstrap-5.3.8-dist/css/bootstrap.min.css}">
	
	<!--/* Font Awesome 6 Icons */-->
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
	
	<!-- /* 초기화 CSS */ -->
	<link rel="stylesheet" th:href="@{/css/reset.css}">
	<!-- 분리한 커스텀 CSS -->
    <link rel="stylesheet" type="text/css" th:href="@{/css/jungyj/event/eventDetail.css}"> 
    
	<script type="text/javascript" th:src="@{/js/jquery-4.0.0.js}"></script>
	<script type="text/javascript" th:src="@{/bootstrap-5.3.8-dist/js/bootstrap.bundle.min.js}"></script>


<script th:inline="javascript">
 /*<![CDATA[*/
	 
	 $(function(){
		 $("#btnWin").on("click", function(){
			const $checked = $(".recipe-check:checked");
			const total_winners = $("input#totalWinner").val();
			
			if($checked.length == 0) {
				alert("당첨 처리할 레시피를 선택해 주세요.");
				return;
			}
			
			if($checked.length > total_winners) {
				alert("당첨 처리는 총 당첨 인원 안에서 선택 가능합니다.");
				return;
			}
			
			if (!confirm("선택한 " + $checked.length + "개의 레시피를 당첨 처리하시겠습니까?")) {
                return;
            }
			
			// 선택한 레시피 배열로 변환
			const entryseqs = $checked.map(function () {
                return Number($(this).val());
            }).get();

            const eventseq = /*[[${eventDto.eventseq}]]*/ 0;
            const winUrl = /*[[@{/admin/event/win}]]*/ "";
            
            $.ajax({
            	url: winUrl,
            	type: "post",
            	data: {
            		eventseq: eventseq,
            		entryseqs: entryseqs
            	},
            	dataType: "json",
            	success: function(data){
            		alert(data.message);
            		if (data.success) {
                        location.reload();
                    }
            	},
                error: function(xhr){
                    const msg = xhr.responseJSON && xhr.responseJSON.message
                    ? xhr.responseJSON.message
                    : "서버 통신 중 오류가 발생했습니다.";
               		alert(msg);
                }
            	
            	
            });
			
		 });
		 
	 }); // end of $(function(){})----------------
 
 
 /*]]>*/   
</script>	 
</head>
<body>
<div class="container py-5">
    <div class="event-detail-wrapper mx-auto d-flex flex-column gap-4">

        <!-- =========================================================
             1. 상단 카드: 이벤트 상세 정보 
             ========================================================= -->
        <div class="card admin-card">
            <div class="card-body p-4 p-md-5">

                <!-- 제목 + 기간 + 상태 -->
                <div class="border-bottom pb-3 mb-4">
                    <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-2">
                        <div class="d-flex align-items-center gap-2">
                            <span class="badge rounded-pill bg-danger-subtle text-danger px-2 py-1"
                                  th:classappend="${eventDto.ddayBadgeClass}"
							      th:text="${eventDto.ddayText}">D-2</span>
                            <span class="text-muted small">
                                <i class="fa-solid fa-trophy text-warning me-1"></i>당첨 인원 <strong th:text="${eventDto.event_total_winners}">5</strong>명
                            </span>
                        </div>
                        <div class="text-muted small">
                            <i class="fa-regular fa-calendar me-1"></i>
                            <span th:text="${eventDto.event_startdate}"></span> ~ 
                            <span th:text="${eventDto.event_enddate}"></span>
                        </div>
                    </div>
                    <h3 class="fw-bold mb-0" th:text="${eventDto.event_subject}">어떤어떤 이벤트 제목이 들어갑니다</h3>
                </div>

                <!-- 이벤트 배너 이미지 (800x420 / 1200x630 비율) -->
                <div class="event-detail-banner mx-auto mb-4">
                    <img th:src="@{/file_eventimageimage/{filename}(filename=${eventDto.event_image_filename})}"
						 th:alt="${eventDto.event_subject}">
                </div>

                <!-- 이벤트 내용 (나중에 스마트에디터 HTML -> th:utext로 출력) -->
                <div class="mb-4">
                    <h6 class="fw-bold text-secondary mb-2">이벤트 내용</h6>
                    <div class="event-content-box p-4 rounded-3">
                        <p class="mb-0" th:text="${eventDto.event_contents}">여기에 스마트에디터로 작성한 이벤트 상세 내용이 표시됩니다.</p>
                    </div>
                </div>

                <!-- 하단 버튼 -->
                <div class="d-flex justify-content-between align-items-center pt-3 border-top">
                    <a th:href="@{/admin/event/list}" class="btn btn-light border px-3">
                        <i class="fa-solid fa-arrow-left me-1"></i> 목록으로
                    </a>
                    <div class="d-flex gap-2">
                        <a th:href="@{/admin/event/edit(eventseq=${eventDto.eventseq})}" class="btn btn-primary px-4 fw-semibold">수정</a>
                        <button type="button" class="btn btn-outline-danger px-4" id="btnDeleteEvent">삭제</button>
                    </div>
                </div>

            </div>
        </div>

        <!-- =========================================================
             2. 중단 카드: 참가한 레시피 목록 (두 번째 설계서 상단)
             ========================================================= -->
        <div class="card admin-card">
            <div class="card-body p-4">

                <div class="d-flex justify-content-between align-items-center mb-3">
                    <div class="d-flex align-items-center gap-2">
                        <h5 class="fw-bold mb-0">참가한 레시피</h5>
						<!-- 건수 뱃지 -->
						<span class="badge rounded-pill bg-primary-subtle text-primary"
						      id="participantCount"
						      th:text="'총 ' + ${#lists.size(entryList)} + '건'">총 0건</span>
                    </div>
                    <span class="text-muted small"
                          th:if="${canDraw}">
                          당첨 처리할 레시피를 선택하세요.
                     </span>
                </div>

				<div th:if="${#lists.isEmpty(entryList)}" class="text-center py-4 text-muted">
				    아직 참가한 레시피가 없습니다.
				</div>
                <!-- 5열 레시피 카드 그리드 (나중에 th:each 반복) -->
                <div class="row row-cols-2 row-cols-md-3 row-cols-lg-5 g-3 mb-4" id="participantRecipeList">


                    <!-- 카드 1 (체크박스 클릭/선택 가능) -->
					<div class="col" th:each="entry : ${entryList}">
					        <label class="card recipe-select-card h-100">
					            <input type="checkbox"
					                   class="form-check-input recipe-check"
					                   th:value="${entry.entryseq}"
					                   th:disabled="${entry.chk_win == 1}">
					            <div class="recipe-card-img">
					                <img th:src="@{/file_recipeimage/{filename}(img=${entry.r_imgname})}" alt="레시피 썸네일">
					            </div>
					            <div class="card-body p-2">
					                <div class="fw-semibold small text-truncate" th:text="${entry.r_subject}">레시피 제목</div>
					                <div class="text-muted" style="font-size: 0.75rem;" th:text="${entry.nickname}">작성자</div>
					            </div>
					        </label>
					    </div>
                 


                </div>

                <!-- 우측 하단: 당첨 / 당첨 취소 버튼 (Ajax용) -->
                <div class="d-flex justify-content-end gap-2 pt-2 border-top"
                     th:if="${canDraw}">
                    <button type="button" class="btn btn-primary px-4 fw-semibold" id="btnWin">
                        <i class="fa-solid fa-check me-1"></i> 당첨
                    </button>
                </div>

            </div>
        </div>

        <!-- =========================================================
             3. 하단 카드: 당첨 레시피 목록 (두 번째 설계서 하단)
             ========================================================= -->
             

        <div class="card admin-card">
            <div class="card-body p-4">

                <div class="d-flex justify-content-between align-items-center mb-3">
                
                    <div class="d-flex align-items-center gap-2">
                        <h5 class="fw-bold mb-0">
                            <i class="fa-solid fa-trophy text-warning me-1"></i> 당첨 레시피
                        </h5>
                        <input type="hidden" id ="totalWinner" th:value="${eventDto.event_total_winners}">
                        <span class="badge rounded-pill bg-warning-subtle text-warning-emphasis"
						      id="winnerCountBadge"
						      th:text="|총 ${#lists.size(winnerList)} / ${eventDto.event_total_winners}명|">총 0 / 5명</span>
                    </div>
                </div>
		        <!-- 비어있을 때 안내 -->
				<div th:if="${#lists.isEmpty(winnerList)}" class="text-center py-4 text-muted">
				    아직 선정된 당첨 레시피가 없습니다.
				</div>

                <!-- 5열 당첨 레시피 카드 그리드 -->
                <div class="row row-cols-2 row-cols-md-3 row-cols-lg-5 g-3" id="winnerRecipeList">

                    <!-- 당첨 카드 1 -->
					<div class="col" th:each="winner : ${winnerList}">
					    <label class="card recipe-select-card winner-card h-100">
					         <span class="badge bg-warning text-dark winner-badge">당첨</span>
					         <div class="recipe-card-img">
					             <img th:src="@{/file_recipeimage/{filename}(img=${winner.r_imgname})}" alt="당첨 레시피">
					             
					         </div>
					         <div class="card-body p-2">
					             <div class="fw-semibold small text-truncate" th:text="${winner.r_subject}">레시피 제목</div>
					             <div class="text-muted" style="font-size: 0.75rem;" th:text="${winner.nickname}">작성자</div>
					         </div>
					     </label>
					 </div>



                </div>

            </div>
        </div>

    </div>
</div>


</body>
</html>
