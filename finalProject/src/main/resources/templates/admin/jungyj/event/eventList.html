<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<!-- 타임리프는 백엔드 서버에서 HTML을 동적으로 렌더링하는 용도로 사용된다. -->

<head>
    <meta charset="UTF-8">
    <title>관리자 - 이벤트 목록</title>
    <!--/* Bootstrap CSS */--> 
	<link rel="stylesheet" type="text/css" th:href="@{/bootstrap-5.3.8-dist/css/bootstrap.min.css}">
	
	<!--/* Font Awesome 6 Icons */-->
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
	
	<!-- 분리한 커스텀 CSS -->
    <link rel="stylesheet" type="text/css" th:href="@{/css/jungyj/event/eventList.css}"> 
    
	<script type="text/javascript" th:src="@{/bootstrap-5.3.8-dist/js/bootstrap.bundle.min.js}"></script>

</head>
<body>

<div class="container py-5">
    <div class="event-list-wrapper mx-auto">

        <!-- 상단 타이틀 + 등록 버튼 -->
        <div class="d-flex justify-content-between align-items-end mb-4">
            <div>
                <h4 class="fw-bold mb-1">이벤트 관리</h4>
                <p class="text-muted small mb-0">진행 중인 이벤트와 참여자 신청 현황을 확인할 수 있습니다.</p>
            </div>
            <a th:href="@{/admin/event/register}" class="btn btn-primary px-4 py-2 fw-semibold shadow-sm">
                <i class="fa-solid fa-plus me-1"></i> 이벤트 등록
            </a>
        </div>

        <!-- 탭 바 -->
        <ul class="nav event-tabs mb-4">
            <li class="nav-item">
				<a class="nav-link"
                   th:classappend="${status == 'ongoing'} ? 'active'"
                   th:href="@{/admin/event/list(status='ongoing')}">
                    현재 진행중인 이벤트
                    <span class="badge rounded-pill ms-1"
                          th:classappend="${status == 'ongoing'} ? 'bg-primary-subtle text-primary' : 'bg-secondary-subtle text-secondary'"
                          th:text="${ongoingCount}">0</span>
                </a>
            </li>
            <li class="nav-item">
				<a class="nav-link"
                   th:classappend="${status == 'ended'} ? 'active'"
                   th:href="@{/admin/event/list(status='ended')}">
                    종료된 이벤트
                    <span class="badge rounded-pill ms-1"
                          th:classappend="${status == 'ended'} ? 'bg-primary-subtle text-primary' : 'bg-secondary-subtle text-secondary'"
                          th:text="${endedCount}">0</span>
                </a>
            </li>
        </ul>

		<!-- 목록 비어있을 때 -->
		<div th:if="${#lists.isEmpty(eventList)}" class="card event-item-card text-center py-5 text-muted">
		    <i class="fa-regular fa-folder-open fs-2 mb-2 d-block"></i>
		    <span th:text="${status == 'ended'} ? '종료된 이벤트가 없습니다.' : '현재 진행중인 이벤트가 없습니다.'">
		        등록된 이벤트가 없습니다.
		    </span>
		</div>
		
		
        <!-- 이벤트 목록  -->
        <div class="d-flex flex-column gap-3" id="eventList">
			<th:block th:if="${not #lists.isEmpty(eventList)}">
				
				<div class="card event-item-card" th:each="eventDto : ${eventList}">
	                <div class="card-body p-3">
	                    <div class="row align-items-center g-3">
	
	                        <!-- 왼쪽: 배너 사진 -->
							<div class="col-12 col-md-auto">
							    <a th:href="@{/admin/event/detail(eventseq=${eventDto.eventseq})}" class="d-block event-thumb">
							        
							        <!-- DB에 저장된 배너 이미지가 있을 때 -->
							        <img th:if="${not #strings.isEmpty(eventDto.event_image_filename)}"
							             th:src="@{/file_eventimageimage/{filename}(filename=${eventDto.event_image_filename})}"
							             th:alt="${eventDto.event_subject}">
							
							        <!-- 배너 이미지가 없을 때 (기본 아이콘) -->
							        <img th:unless="${not #strings.isEmpty(eventDto.event_image_filename)}"
							             th:src="@{/images/jungyj/event/imageicon.png}"
							             alt="배너 사진">
							             
							    </a>
							</div>
	
	                        <!-- 가운데: D-Day 뱃지 + 제목 + 기간/당첨인원 -->
	                        <div class="col min-w-0">
	                            <div class="mb-2 d-flex align-items-center gap-2">
	                                <span class="badge rounded-pill px-2 py-1"
							              th:classappend="${eventDto.ddayBadgeClass}"
							              th:text="${eventDto.ddayText}">D-2</span>
	                                <span class="text-muted small">
	                                    <i class="fa-solid fa-trophy text-warning me-1"></i>당첨 <span th:text="${eventDto.event_total_winners}">5</span>명
	                                </span>
	                            </div>
	
	                            <a th:href="@{/admin/event/detail(eventseq=${eventDto.eventseq})}" class="event-title-link text-decoration-none">
	                                <h5 class="fw-bold mb-2 text-truncate" th:text="${eventDto.event_subject}" ></h5>
	                            </a>
	
	                            <div class="text-muted small">
	                                <i class="fa-regular fa-calendar me-1"></i>
	                                <span th:text="${eventDto.event_startdate}"></span> ~ 
	                                <span th:text="${eventDto.event_enddate}"></span>
	                            </div>
	                        </div>
	
	                        <!-- 오른쪽: 신청현황 버튼 -->
	                        <div class="col-12 col-md-auto text-md-end">
	                                <i class="fa-solid fa-users me-1 text-secondary"></i>
	                                신청현황 <span class="text-primary fw-bold ms-1">5</span>건
	                        </div>
	
	                    </div>
	                </div>
	            </div>
			</th:block>
            <!-- 이벤트 카드 1 -->


        </div>

        <!-- 목록 비어있을 때 -->
        <!--
        <div class="card event-item-card text-center py-5 text-muted">
            <i class="fa-regular fa-folder-open fs-2 mb-2 d-block"></i>
            등록된 이벤트가 없습니다.
        </div>
        -->

        <!-- 페이지네이션 -->
        <nav class="mt-5" aria-label="이벤트 페이지네이션">
            <ul class="pagination justify-content-center gap-1">
                <li class="page-item disabled"><a class="page-link rounded" href="#">이전</a></li>
                <li class="page-item active"><a class="page-link rounded" href="#">1</a></li>
                <li class="page-item"><a class="page-link rounded" href="#">2</a></li>
                <li class="page-item"><a class="page-link rounded" href="#">3</a></li>
                <li class="page-item"><a class="page-link rounded" href="#">다음</a></li>
            </ul>
        </nav>

    </div>
</div>

</body>
</html>
