<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>관리자 - 이벤트 목록</title>
    <!--/* Bootstrap CSS */-->
    <link rel="stylesheet" type="text/css" th:href="@{/bootstrap-5.3.8-dist/css/bootstrap.min.css}">

    <!--/* Font Awesome 6 Icons */-->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <!--/* 초기화 CSS */-->
    <link rel="stylesheet" th:href="@{/css/reset.css}">

    <!--/* 커스텀 CSS */-->
    <link rel="stylesheet" type="text/css" th:href="@{/css/jungyj/event/eventList.css}">

    <script type="text/javascript" th:src="@{/bootstrap-5.3.8-dist/js/bootstrap.bundle.min.js}"></script>
</head>
<body>

<div class="container py-5">
    <div class="event-list-wrapper mx-auto">

        <!-- 상단 타이틀 + 등록 버튼 -->
        <div class="d-flex justify-content-between align-items-end mb-4">
            <div>
                <h4 class="fw-bold mb-1">이벤트 관리</h4>
                <p class="text-muted small mb-0">진행 중인 이벤트와 참여자 신청 현황을 확인하고 당첨자를 선정할 수 있습니다.</p>
            </div>
            <a th:href="@{/admin/event/register}" class="btn btn-dark px-3 py-2 fw-medium">
                <i class="fa-solid fa-plus me-1"></i> 이벤트 등록
            </a>
        </div>

        <!-- 탭 바 (2개: 진행 중 / 종료됨) -->
        <ul class="nav event-tabs mb-4">
            <li class="nav-item">
                <a class="nav-link"
                   th:classappend="${status == 'ongoing'} ? 'active'"
                   th:href="@{/admin/event/list(status='ongoing')}">
                    진행 중 <span class="tab-num" th:text="${ongoingCount}">0</span>
                </a>
            </li>
            <li class="nav-item">
                <a class="nav-link"
                   th:classappend="${status == 'ended'} ? 'active'"
                   th:href="@{/admin/event/list(status='ended')}">
                    종료됨 <span class="tab-num" th:text="${endedCount}">0</span>
                </a>
            </li>
        </ul>

        <!-- [영역 1] 상단 고정: 당첨자 선정 필요 영역 (진행 중 탭 & 1건 이상일 때만 표시) -->
        <section th:if="${status == 'ongoing' and not #lists.isEmpty(drawingList)}" class="drawing-section mb-4">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <div>
                    <h6 class="fw-bold mb-0 text-dark">
                        당첨자 선정 필요
                        <span class="text-danger ms-1" th:text="${#lists.size(drawingList)} + '건'">1건</span>
                    </h6>
                    <p class="text-muted small mb-0">응모가 마감되어 발표일 전까지 당첨자 선정이 필요한 이벤트입니다.</p>
                </div>
            </div>

            <div class="d-flex flex-column gap-3">
                <div class="event-card" th:each="drawDto : ${drawingList}">
                    <div class="row align-items-center g-3 g-md-4">

                        <!-- 왼쪽: 배너 이미지 -->
                        <div class="col-12 col-md-auto">
                            <a th:href="@{/admin/event/detail(eventseq=${drawDto.eventseq})}" class="d-block event-thumb">
                                <img th:if="${not #strings.isEmpty(drawDto.event_image_filename)}"
                                     th:src="@{/file_eventimageimage/{filename}(filename=${drawDto.event_image_filename})}"
                                     th:alt="${drawDto.event_subject}">
                                <img th:unless="${not #strings.isEmpty(drawDto.event_image_filename)}"
                                     th:src="@{/images/jungyj/event/imageicon.png}"
                                     alt="배너 사진">
                            </a>
                        </div>

                        <!-- 가운데: 상태 + 제목 + 일정 -->
                        <div class="col min-w-0">
                            <div class="d-flex align-items-center gap-2 mb-2">
                                <span class="status-tag tag-drawing">당첨 선정 필요</span>
                                <span class="text-muted small">
                                    당첨 <strong class="text-dark fw-semibold" th:text="${drawDto.event_total_winners}">5</strong>명
                                </span>
                            </div>

                            <a th:href="@{/admin/event/detail(eventseq=${drawDto.eventseq})}" class="event-title-link">
                                <h5 class="fw-bold mb-2 text-truncate" th:text="${drawDto.event_subject}">이벤트 제목</h5>
                            </a>

                            <div class="event-meta text-muted small">
                                <span>
                                    응모 <span th:text="${drawDto.event_startdate}"></span> ~ <span th:text="${drawDto.event_enddate}"></span>
                                </span>
                                <span class="meta-dot">·</span>
                                <span class="text-danger fw-medium">
                                    발표 <span th:text="${drawDto.event_drawingdate}"></span>
                                </span>
                            </div>
                        </div>

                        <!-- 오른쪽: 신청현황 + 당첨자 선정 버튼 -->
                        <div class="col-12 col-md-auto text-md-end d-flex flex-row flex-md-column justify-content-between align-items-center align-items-md-end gap-2">
                            <div class="small text-muted">
                                신청현황 <strong class="text-dark ms-1" th:text="${drawDto.entryCount}">0</strong>건
                            </div>

                            <a th:href="@{/admin/event/detail(eventseq=${drawDto.eventseq})}"
                               class="btn btn-sm btn-primary px-3">
                                당첨자 선정
                            </a>
                        </div>

                    </div>
                </div>
            </div>
        </section>

        <!-- [영역 2] 하단: 일반 이벤트 목록 영역 -->
        <section>
            <!-- 영역 구분 헤더 (상단 당첨 영역이 있을 때만 타이틀 노출) -->
            <div th:if="${status == 'ongoing' and not #lists.isEmpty(drawingList)}"
                 class="list-section-header d-flex justify-content-between align-items-center mb-3">
                <h6 class="fw-bold mb-0 text-dark">진행 중인 이벤트</h6>
                <span class="text-muted small" th:text="'총 ' + ${totalDataCount} + '건'">총 0건</span>
            </div>

            <!-- 목록 비어있을 때 -->
            <div th:if="${#lists.isEmpty(eventList)}" class="event-empty text-center py-5 text-muted">
                <i class="fa-regular fa-folder-open fs-3 mb-2 d-block opacity-50"></i>
                <span class="small"
                      th:text="${status == 'ended'} ? '종료된 이벤트가 없습니다.' : '현재 응모 진행 중인 이벤트가 없습니다.'">
                    등록된 이벤트가 없습니다.
                </span>
            </div>

            <!-- 이벤트 목록 (페이징) -->
            <div class="d-flex flex-column gap-3" id="eventList" th:if="${not #lists.isEmpty(eventList)}">
                <div class="event-card" th:each="eventDto : ${eventList}">
                    <div class="row align-items-center g-3 g-md-4">

                        <!-- 왼쪽: 배너 이미지 -->
                        <div class="col-12 col-md-auto">
                            <a th:href="@{/admin/event/detail(eventseq=${eventDto.eventseq})}" class="d-block event-thumb">
                                <img th:if="${not #strings.isEmpty(eventDto.event_image_filename)}"
                                     th:src="@{/file_eventimageimage/{filename}(filename=${eventDto.event_image_filename})}"
                                     th:alt="${eventDto.event_subject}">
                                <img th:unless="${not #strings.isEmpty(eventDto.event_image_filename)}"
                                     th:src="@{/images/jungyj/event/imageicon.png}"
                                     alt="배너 사진">
                            </a>
                        </div>

                        <!-- 가운데: 상태 태그 + 제목 + 일정 -->
                        <div class="col min-w-0">
                            <div class="d-flex align-items-center gap-2 mb-2">
                                <span th:if="${status == 'ongoing'}"
                                      class="status-tag"
                                      th:classappend="${eventDto.ddayBadgeClass}"
                                      th:text="${eventDto.ddayText}">D-2</span>

                                <span th:if="${status == 'ended'}"
                                      class="status-tag tag-ended">발표 완료</span>

                                <span class="text-muted small">
                                    당첨 <strong class="text-dark fw-semibold" th:text="${eventDto.event_total_winners}">5</strong>명
                                </span>
                            </div>

                            <a th:href="@{/admin/event/detail(eventseq=${eventDto.eventseq})}" class="event-title-link">
                                <h5 class="fw-bold mb-2 text-truncate" th:text="${eventDto.event_subject}">이벤트 제목</h5>
                            </a>

                            <div class="event-meta text-muted small">
                                <span>
                                    응모 <span th:text="${eventDto.event_startdate}"></span> ~ <span th:text="${eventDto.event_enddate}"></span>
                                </span>
                                <span class="meta-dot">·</span>
                                <span>
                                    발표 <span th:text="${eventDto.event_drawingdate}"></span>
                                </span>
                            </div>
                        </div>

                        <!-- 오른쪽: 신청현황 + 상세보기 버튼 -->
                        <div class="col-12 col-md-auto text-md-end d-flex flex-row flex-md-column justify-content-between align-items-center align-items-md-end gap-2">
                            <div class="small text-muted">
                                신청현황 <strong class="text-dark ms-1" th:text="${eventDto.entryCount}">0</strong>건
                            </div>

                            <a th:href="@{/admin/event/detail(eventseq=${eventDto.eventseq})}"
                               class="btn btn-sm btn-outline-secondary px-3">
                                상세보기
                            </a>
                        </div>

                    </div>
                </div>
            </div>

            <!-- 페이지네이션 -->
            <div class="mt-5" th:utext="${pageBar}"></div>
        </section>

    </div>
</div>

</body>
</html>
