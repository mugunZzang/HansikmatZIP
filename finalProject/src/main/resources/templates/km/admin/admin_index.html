<!DOCTYPE html>
<html th:replace="~{layout/layout_admin_main :: layout(~{::title}, ~{::link}, ~{::style}, ~{::script}, ~{::section})}"
      lang="ko"
      xmlns:th="http://www.thymeleaf.org">
<!--/* ::title 은   현재 페이지의 title   태그를 읽어다가 templates/layout/layout_main.html 파일의 th:fragment="layout(title, link, css, script, content)" 에 있는 첫번째 파라미터로 전달한다. */-->
<!--/* ::link  는   현재 페이지의 link    태그를 읽어다가 templates/layout/layout_main.html 파일의 th:fragment="layout(title, link, css, script, content)" 에 있는 두번째 파라미터로 전달한다. */--> 
<!--/* ::style 은   현재 페이지의 style   태그를 읽어다가 templates/layout/layout_main.html 파일의 th:fragment="layout(title, link, css, script, content)" 에 있는 세번째 파라미터로 전달한다. */-->
<!--/* ::script 는  현재 페이지의 script  태그를 읽어다가 templates/layout/layout_main.html 파일의 th:fragment="layout(title, link, css, script, content)" 에 있는 네번째 파라미터로 전달한다. */-->
<!--/* ::section 은 현재 페이지의 section 태그를 읽어다가 templates/layout/layout_main.html 파일의 th:fragment="layout(title, link, css, script, content)" 에 있는 다섯번째 파라미터로 전달한다. */-->
<!--/* 타임리프는 백엔드 서버에서 HTML을 동적으로 렌더링하는 용도로 사용된다. */-->

<head>
<meta charset="UTF-8">
<title>관리자페이지</title>
<link rel="stylesheet" href="">

<style type="text/css">

body {
    background-color: #f5f7f9;
}

/* 전체 대시보드 */
.admin-dashboard {
    width: 100%;
    padding: 40px 50px 0;
    box-sizing: border-box;
}

/* TODAY 영역 */
.today-section {
    width: calc(100% - 80px);
    margin: 30px auto 0; /* 위쪽 여백 30px */
    margin-left: auto;
    margin-right: auto;
    padding: 25px 20px 20px;
    background-color: white;
    border: 1px solid #e5e5e5;
    border-radius: 5px;
    box-sizing: border-box;
}

.today-title {
    font-size: 30px;
    color: #17658a;
    margin: 0 0 25px 5px;
    font-weight: bold;
}

/* 통계 항목 */
.today-stats {
    display: grid;
    grid-template-columns: 1.5fr 1fr;
    gap: 20px;
    width: 100%;
    align-items: stretch;
    box-sizing: border-box;
}
/* 공통 통계 박스 */
.today-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;

    padding: 20px 25px;
    background-color: white;
    border: 1px solid #e5e5e5;
    border-radius: 4px;

    min-width: 0;
    box-sizing: border-box;
}

.today-info {
    flex: 1;
    font-size: 17px;
    font-weight: 600;
    text-align: center;
    line-height: 1.6;
    white-space: nowrap;
}

.today-divider {
    display: block !important;
    width: 100% !important;
    height: 3px !important;
    background-color: #17658a !important;
    border: 0 !important;
    opacity: 1 !important;
    margin: 30px 0 !important;
}

/* 원형 아이콘 */
.today-icon {
    width: 90px;
    height: 90px;
    min-width: 90px;

    border-radius: 50%;
    background-color: #17658a;
    border: 1px solid #123f55;

    display: flex;
    align-items: center;
    justify-content: center;

    color: white;
    font-size: 15px;
    font-weight: bold;
    text-align: center;

    margin-left: auto;
}

/* 하단 영역 */
.dashboard-bottom {
    display: grid;
    grid-template-columns: 40% minmax(0, 1fr);
    gap: 20px;

    width: calc(100% - 80px);
    margin: 30px auto 0;
    padding: 0;

    box-sizing: border-box;
}

/* 이벤트 영역 */
.event-section,
.recipe-section {
    background-color: white;
    border: 1px solid #e5e5e5;
    border-radius: 5px;
    padding: 25px 20px;
    box-sizing: border-box;
    min-height: 280px;
}

.section-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 15px;
    font-size: 18px;
    font-weight: bold;
}

.more-btn {
    background-color: white;
    border: 1px solid #17658a;
    padding: 7px 16px;
    font-size: 14px;
    cursor: pointer;
}

.more-btn:hover {
    background-color: #17658a;
    color: white;
}

/* 이벤트 카드 */
.event-list {
    display: flex;
    flex-direction: column;
    gap: 10px;
}

.event-card {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background-color: #17658a;
    border: 1px solid #123f55;
    color: white;
    padding: 18px 15px;
    min-height: 75px;
    box-sizing: border-box;
    gap: 10px;
}

.event-name {
    font-size: 17px;
    font-weight: bold;
}

.event-date {
    font-size: 14px;
    margin-top: 6px;
}

.event-detail {
    background-color: white;
    color: #17658a;
    border: 1px solid #123f55;
    padding: 9px 13px;
    font-size: 13px;
    cursor: pointer;
    white-space: nowrap;
}

.event-detail:hover {
    background-color: #e8f2f7;
}


.recipe-title {
    font-size: 18px;
    font-weight: bold;
    margin-bottom: 15px;
}

/* 파이 그래프 임시 영역 */
.recipe-chart {
    width: 190px;
    height: 190px;
    border-radius: 50%;
    background-color: #17658a;
    border: 1px solid #123f55;
    display: flex;
    align-items: center;
    justify-content: center;
    color: white;
    font-size: 17px;
    font-weight: bold;
    text-align: center;
    margin-left: 500px
}

/* 문의사항 영역 */
.today-qna {
    width: 100%;
    min-width: 0;
    align-items: flex-start;
}
.today-qna .today-info {
    width: 100%;
    display: block;
}

.today-qna-title {
    font-size: 18px;
    font-weight: bold;
    margin-bottom: 15px;
}

.today-qna-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
    text-align: center;
}

.today-qna-table th {
    background-color: #f1f4f7;
    padding: 10px 5px;
    border-bottom: 1px solid #ddd;
}

.today-qna-table td {
    padding: 12px 5px;
    border-bottom: 1px solid #eee;
}

.today-qna-table td:first-child {
    text-align: left;
    max-width: 180px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}

.qna-wait {
    color: #e05a5a;
    font-weight: bold;
}

.qna-complete {
    color: #258a65;
    font-weight: bold;
}


/* 반응형 */
@media (max-width: 1200px) {
    .today-stats {
        grid-template-columns: repeat(2, 1fr);
        row-gap: 25px;
    }

    .dashboard-bottom {
        grid-template-columns: 1fr;
    }
}

@media (max-width: 550px) {
    .today-stats {
        grid-template-columns: 1fr;
    }

    .today-item {
        justify-content: space-between;
    }

    .dashboard-bottom {
        padding: 25px 15px;
    }

    .today-info {
        white-space: normal;
    }
}

</style>

</head>
<body>
