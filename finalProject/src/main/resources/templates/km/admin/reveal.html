<!DOCTYPE html>
<html th:replace="~{layout/layout_admin_main :: layout(~{::title}, ~{::link}, ~{::style}, ~{::script}, ~{::div.container-fluid})}"
      lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<!--/* ::title 은   현재 페이지의 title   태그를 읽어다가 templates/layout/layout_main.html 파일의 th:fragment="layout(title, link, css, script, content)" 에 있는 첫번째 파라미터로 전달한다. */-->
<!--/* ::link  는   현재 페이지의 link    태그를 읽어다가 templates/layout/layout_main.html 파일의 th:fragment="layout(title, link, css, script, content)" 에 있는 두번째 파라미터로 전달한다. */--> 
<!--/* ::style 은   현재 페이지의 style   태그를 읽어다가 templates/layout/layout_main.html 파일의 th:fragment="layout(title, link, css, script, content)" 에 있는 세번째 파라미터로 전달한다. */-->
<!--/* ::script 는  현재 페이지의 script  태그를 읽어다가 templates/layout/layout_main.html 파일의 th:fragment="layout(title, link, css, script, content)" 에 있는 네번째 파라미터로 전달한다. */-->
<!--/* ::section 은 현재 페이지의 section 태그를 읽어다가 templates/layout/layout_main.html 파일의 th:fragment="layout(title, link, css, script, content)" 에 있는 다섯번째 파라미터로 전달한다. */-->
<!--/* 타임리프는 백엔드 서버에서 HTML을 동적으로 렌더링하는 용도로 사용된다. */-->

<body>
   
<div class="container-fluid py-4 px-5">

    <div class="row g-4">
		<th:block th:if="${revealList != null}">
        <div th:each="revealList : ${revealList}"class="col-12 col-sm-6 col-xl-3">
            <div class="card h-100 shadow-sm">
                <img th:src='@{/file_recipeimage/{r_imgname}(r_imgname=${revealList.r_imgname})}' class="card-img-top" alt="레시피 이미지">
				
                <div class="card-body">
                    <h5 class="card-title" th:text="${revealList.r_subject}"></h5>
                    <p class="card-text mb-2" th:text="|작성자 : ${revealList.nickname}|"></p>
                    <p class="card-text mb-2" th:text="|작성일 : ${revealList.r_writedate}|"></p>
                    <span class="badge bg-warning text-dark">검수 대기</span>
                    <div class="mt-3">
                        <a href="#" class="btn btn-primary w-100">상세페이지로 가기</a>
                    </div>
                </div>
            </div>
        </div>
        </th:block>
        <th:block th:if="${revealList == null or revealList.isEmpty()}">

        	</div>
        </th:block>
