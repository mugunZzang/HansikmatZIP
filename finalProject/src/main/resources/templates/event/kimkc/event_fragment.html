<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

	<div th:fragment="eventListFragment(eventList, pageBar, status)">
	
	    <!-- 데이터가 없을 때 -->
	    <div th:if="${#lists.isEmpty(eventList)}" class="text-center py-5 my-4 text-muted border rounded-4">
	        <p class="mb-0 fs-5">등록된 이벤트가 없습니다.</p>
	    </div>
	
	    <!-- 이벤트 카드 리스트 (최대 5개) -->
	    <div th:unless="${#lists.isEmpty(eventList)}" class="d-flex flex-column gap-3">
	        
	        <a th:each="event : ${eventList}" 
	           
	           class="text-decoration-none text-dark">
	            <!-- th:href="" @{/event/detail/{seq}(seq=${event.eventSeq})} -->
            <div class="event-card p-3 bg-white">
                <div class="row g-4 align-items-center">
	                    
                    <!-- 좌측: 이벤트 배너 이미지 영역 -->
                    <div class="col-12 col-md-5">
                        <img  
                             alt="이벤트 배너" 
                             class="event-banner-img rounded-3">
                             <!-- th:src="@{/images/event/{img}(img=${event.bannerImg})}" -->
                    </div>

                    <!-- 우측: D-day 배지 + 제목 + 기간 -->
                    <div class="col-12 col-md-7 px-md-3">
                        <!-- D-day 배지 (진행중일 때만 D-15 표시, 종료 시 '종료' 표시) -->
                        <div class="mb-2">
                            <span th:if="${status == 'ongoing'}" 
                                  class="badge bg-secondary px-3 py-2 fs-6 fw-normal rounded-2"
                                  th:text="'D-' + ${event.dDay}">D-15</span>
                            <span th:if="${status == 'ended'}" 
                                  class="badge bg-dark px-3 py-2 fs-6 fw-normal rounded-2">종료</span>
                        </div>

                        <!-- 이벤트 제목 -->
                        <h5 class="fw-bold mb-2 text-truncate" th:text="${event.event_subject}">
                            이벤트 제목
                        </h5>

                        <!-- 이벤트 기간 -->
                        <p class="text-muted mb-0 small">
                            <span th:text="${event.event_startdate}">2026.11.18</span>
                            ~
                            <span th:text="${event.event_enddate}">2026.12.15</span>
                        </p>
                    </div>

                </div>
            </div>
	        </a>
	
	    </div>
	
	    <!-- 페이지바 영역 (페이지바 높이 공간 미리 확보) -->
	    <div class="mt-5 mb-3 d-flex justify-content-center" style="min-height: 40px;">
	        <!-- 컨트롤러에서 만든 pageBar 문자열을 출력할 경우 -->
	        <nav th:if="${not #strings.isEmpty(pageBar)}" aria-label="Page navigation">
	            <!-- <ul class="pagination mb-0" th:utext="${pageBar}"></ul> -->
	            <div th:utext="${pageBar}"></div>
	        </nav>
	    </div>
	
	</div>
</html>
