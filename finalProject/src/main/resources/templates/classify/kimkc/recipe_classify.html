<!DOCTYPE html>
<html th:replace="~{layout/layout_main :: layout(~{::title}, ~{::link}, ~{::style}, ~{::script}, ~{::div.container})}" 
      lang="ko" 
      xmlns:th="http://www.thymeleaf.org">
				
<!-- 타임리프는 백엔드 서버에서 HTML을 동적으로 렌더링하는 용도로 사용된다. -->




<!--/* Bootstrap CSS */--> 
<link rel="stylesheet" type="text/css" th:href="@{/bootstrap-5.3.8-dist/css/bootstrap.min.css}">

<!--/* Optional JavaScript */-->
<script type="text/javascript" th:src="@{/js/jquery-4.0.0.js}"></script>
  
<script type="text/javascript" th:src="@{/bootstrap-5.3.8-dist/js/bootstrap.bundle.min.js}"></script>

<head>
<meta charset="UTF-8">
<title>한식맛ZIP</title>

<!-- 커스텀 css -->
<link rel="stylesheet" type="text/css" th:href="@{/css/kimkc/recipe/recipe_classify.css}"> 

<style type="text/css">
    
</style>

<!--/* 
      자바스크립트 인라인 
      th:inline="javascript" 은 스크립트 태그 내에서 Thymeleaf 문법([[...]])을 해석할 수 있게 해주는 설정이다.
      JavaScript 안에서 Thymeleaf 값을 넣을 때는 th:inline="javascript" 와 /*[[뭐뭐뭐]]*/ 구문을 사용해야 한다. 
*/-->
<script th:inline="javascript">
/*<![CDATA[*/
	$(function(){
		
		// 검색조건 유지하기 
	    const resultMap = /*[[${resultMap}]]*/ {};

	    if (resultMap) {
	        if (resultMap.cf_type)       $(`input:radio[name="cf_type"][value="${resultMap.cf_type}"]`).prop('checked', true);
	        if (resultMap.cf_main)       $(`input:radio[name="cf_main"][value="${resultMap.cf_main}"]`).prop('checked', true);
	        if (resultMap.cf_situation)  $(`input:radio[name="cf_situation"][value="${resultMap.cf_situation}"]`).prop('checked', true);
	        if (resultMap.cf_recipe)     $(`input:radio[name="cf_recipe"][value="${resultMap.cf_recipe}"]`).prop('checked', true);
	        if (resultMap.cf_membership) $(`input:radio[name="cf_membership"][value="${resultMap.cf_membership}"]`).prop('checked', true);
	        if (resultMap.cf_sort)       $(`input:radio[name="cf_sort"][value="${resultMap.cf_sort}"]`).prop('checked', true);

	        if (resultMap.cf_time)       $('select[name="cf_time"]').val(resultMap.cf_time);
	        if (resultMap.cf_level)      $('select[name="cf_level"]').val(resultMap.cf_level);
	        if (resultMap.cf_people)     $('select[name="cf_people"]').val(resultMap.cf_people);
	    }
	
		
		
		// 검색 버튼 클릭 시
		$('button#btn-search').on('click', function() {
			goSearch(1);	
		})
		
		// 정렬 기준 선택 시
		$('input:radio[name="cf_sort"]').on('change', function() {
			goSearch(1);
		});
		
		
	});
	
	// =============================================================================================================================
	
	
	// 검색 조건에 맞는 레시피 불러오기
	function goSearch(currentShowPageNo) {
		//console.log(`종류별 : ${type}, 주재료별 : ${main}, 상황별 : ${situation}, 방법별 : ${how}, 소요시간 : ${time}, 난이도 : ${difficulty}, 인원수 : ${membercnt}, 멤버십 : ${membership}`);
		
		const cf_sort = $('input:radio[name="cf_sort"]:checked').val();
		
		const frm = $('form[name="classifyFrm"]');
		frm.find('input[name="currentShowPageNo"]').val(currentShowPageNo);
		frm.find('input[name="cf_sort"]').val(cf_sort); 
		frm.attr('method', 'get');
		frm.attr('action', /*[[@{/classify/list}]]*/ '');
		frm.submit();

	}
	
/*]]>*/   
</script>

</head>
<body>
    <div class="container my-5">
    	
    	<!-- 상단 타이틀 -->
    	<h3 class="fw-bold mb-3">분류</h3>
    	<hr class="mb-4">
    	
    	<!--/* 분류 선택란 */-->
    	<div class="classify-wrap">
    	
    		<form name="classifyFrm">
    	
	    		<!--/* 1. 종류별 */-->
	    		<div class="cf-row d-flex align-items-start mb-3">
	    			<div class="cf-label">종류별</div>
		    		<div class="cf-list d-flex flex-wrap gap-2">
		    			<input type="radio" class="btn-check" id="r1_option1" name="cf_type" value="전체" checked>
	  					<label class="btn cf-btn" for="r1_option1">전체</label>
	
		    			<input type="radio" class="btn-check" id="r1_option2" name="cf_type" value="밥/죽/면">
	  					<label class="btn cf-btn" for="r1_option2">밥/죽/면</label>
	
	  					<input type="radio" class="btn-check" id="r1_option3" name="cf_type" value="국/탕/찌개">
	  					<label class="btn cf-btn" for="r1_option3">국/탕/찌개</label>
	
	  					<input type="radio" class="btn-check" id="r1_option4" name="cf_type" value="메인반찬">
	  					<label class="btn cf-btn" for="r1_option4">메인반찬</label>
	
	  					<input type="radio" class="btn-check" id="r1_option5" name="cf_type" value="밑반찬">
	  					<label class="btn cf-btn" for="r1_option5">밑반찬</label>
	
	  					<input type="radio" class="btn-check" id="r1_option6" name="cf_type" value="전/적/튀김">
	  					<label class="btn cf-btn" for="r1_option6">전/적/튀김</label>
	
	  					<input type="radio" class="btn-check" id="r1_option7" name="cf_type" value="김치/젓갈/장아찌">
	  					<label class="btn cf-btn" for="r1_option7">김치/젓갈/장아찌</label>
	
	  					<input type="radio" class="btn-check" id="r1_option8" name="cf_type" value="안주/야식/간식">
	  					<label class="btn cf-btn" for="r1_option8">안주/야식/간식</label>
					</div>	    	
	    		</div>
	    		
	    		<!--/* 2. 주재료별 */-->
	    		<div class="cf-row d-flex align-items-start mb-3">
	    			<div class="cf-label">주재료별</div>
	    			<div class="cf-list d-flex flex-wrap gap-2">
	    				<input type="radio" class="btn-check" id="r2_option1" name="cf_main" value="전체" checked>
	  					<label class="btn cf-btn" for="r2_option1">전체</label>
	
		    			<input type="radio" class="btn-check" id="r2_option2" name="cf_main" value="육류">
	  					<label class="btn cf-btn" for="r2_option2">육류</label>
	
	  					<input type="radio" class="btn-check" id="r2_option3" name="cf_main" value="해산물/건어물">
	  					<label class="btn cf-btn" for="r2_option3">해산물/건어물</label>
	
	  					<input type="radio" class="btn-check" id="r2_option4" name="cf_main" value="채소/버섯류">
	  					<label class="btn cf-btn" for="r2_option4">채소/버섯류</label>
	
	  					<input type="radio" class="btn-check" id="r2_option5" name="cf_main" value="달걀/유제품">
	  					<label class="btn cf-btn" for="r2_option5">달걀/유제품</label>
	
	  					<input type="radio" class="btn-check" id="r2_option6" name="cf_main" value="가공식품/기타">
	  					<label class="btn cf-btn" for="r2_option6">가공식품/기타</label>
	    			</div>
	    		</div>
	    		
	    		<!--/* 3. 상황별 */-->
	    		<div class="cf-row d-flex align-items-start mb-3">
	    			<div class="cf-label">상황별</div>
	    			<div class="cf-list d-flex flex-wrap gap-2">
	    				<input type="radio" class="btn-check" id="r3_option1" name="cf_situation" value="전체" checked>
	  					<label class="btn cf-btn" for="r3_option1">전체</label>
	
		    			<input type="radio" class="btn-check" id="r3_option2" name="cf_situation" value="혼밥/자취요리">
	  					<label class="btn cf-btn" for="r3_option2">혼밥/자취요리</label>
	
	  					<input type="radio" class="btn-check" id="r3_option3" name="cf_situation" value="손님초대/생일상">
	  					<label class="btn cf-btn" for="r3_option3">손님초대/생일상</label>
	
	  					<input type="radio" class="btn-check" id="r3_option4" name="cf_situation" value="술안주/해장">
	  					<label class="btn cf-btn" for="r3_option4">술안주/해장</label>
	
	  					<input type="radio" class="btn-check" id="r3_option5" name="cf_situation" value="다이어트/건강식">
	  					<label class="btn cf-btn" for="r3_option5">다이어트/건강식</label>
	
	  					<input type="radio" class="btn-check" id="r3_option6" name="cf_situation" value="도시락/밀키트">
	  					<label class="btn cf-btn" for="r3_option6">도시락/밀키트</label>
	    			</div>
	    		</div>
	    		
	    		<!--/* 4. 방법별 */-->
	    		<div class="cf-row d-flex align-items-start mb-3">
	    			<div class="cf-label">방법별</div>
	    			<div class="cf-list d-flex flex-wrap gap-2">
	    				<input type="radio" class="btn-check" id="r4_option1" name="cf_recipe" value="전체" checked>
	  					<label class="btn cf-btn" for="r4_option1">전체</label>
	
		    			<input type="radio" class="btn-check" id="r4_option2" name="cf_recipe" value="볶음/조림/찜">
	  					<label class="btn cf-btn" for="r4_option2">볶음/조림/찜</label>
	
	  					<input type="radio" class="btn-check" id="r4_option3" name="cf_recipe" value="끓이기">
	  					<label class="btn cf-btn" for="r4_option3">끓이기</label>
	
	  					<input type="radio" class="btn-check" id="r4_option4" name="cf_recipe" value="전/구이/튀김">
	  					<label class="btn cf-btn" for="r4_option4">전/구이/튀김</label>
	
	  					<input type="radio" class="btn-check" id="r4_option5" name="cf_recipe" value="무침/회">
	  					<label class="btn cf-btn" for="r4_option5">무침/회</label>
	
	  					<input type="radio" class="btn-check" id="r4_option6" name="cf_recipe" value="에어프라이어/전자레인지">
	  					<label class="btn cf-btn" for="r4_option6">에어프라이어/전자레인지</label>
	    			</div>
	    		</div>
	    		
	    		<!--/* 5. 조리시간 / 난이도 / 인원수 */-->
	    		<div class="row g-3 mb-3 align-items-center">
	    			<div class="col-md-4 d-flex align-items-center">
	    				<div class="cf-label pt-0">조리시간</div>
	    				<select id="time" class="form-select form-select-sm w-auto" name="cf_time" style="min-width: 130px;">
		    				<option value="전체" selected>전체</option>
		    				<option value="5분이내">5분 이내</option>
		    				<option value="10분이내">10분 이내</option>
		    				<option value="15분이내">15분 이내</option>
		    				<option value="20분이내">20분 이내</option>
		    				<option value="30분이내">30분 이내</option>
		    				<option value="1시간이내">1시간 이내</option>
		    				<option value="1시간이상">1시간 이상</option>
		    			</select>
	    			</div>
	    			
	    			<div class="col-md-4 d-flex align-items-center">
	    				<div class="cf-label pt-0">난이도</div>
	    				<select id="level" class="form-select form-select-sm w-auto" name="cf_level" style="min-width: 130px;">
		    				<option value="전체" selected>전체</option>
		    				<option value="초급(요린이)">초급(요린이)</option>
		    				<option value="중급">중급</option>
		    				<option value="상급">상급</option>
		    			</select>
	    			</div>
	    			
	    			<div class="col-md-4 d-flex align-items-center">
	    				<div class="cf-label pt-0">인원수</div>
	    				<select id="people" class="form-select form-select-sm w-auto" name="cf_people" style="min-width: 130px;">
		    				<option value="전체" selected>전체</option>
		    				<option value="1인분">1인분</option>
		    				<option value="2인분">2인분</option>
		    				<option value="3인분">3인분</option>
		    				<option value="4인분">4인분</option>
		    				<option value="4인분 이상">4인분 이상</option>
		    			</select>
	    			</div>
	    		</div>
	    		
	    		<!--/* 6. 멤버십 */-->
	    		<div class="cf-row d-flex align-items-start mb-4">
	    			<div class="cf-label">멤버십</div>
	    			<div class="cf-list d-flex flex-wrap gap-2">
	    				<input type="radio" class="btn-check" id="r5_option1" name="cf_membership" value="전체" checked>
	  					<label class="btn cf-btn" for="r5_option1">전체</label>
	
		    			<input type="radio" class="btn-check" id="r5_option2" name="cf_membership" value="유료">
	  					<label class="btn cf-btn" for="r5_option2">유료</label>
	
	  					<input type="radio" class="btn-check" id="r5_option3" name="cf_membership" value="무료">
	  					<label class="btn cf-btn" for="r5_option3">무료</label>
	    			</div>
	    		</div>
	    	
	    		
	    		<!--/* 페이지 번호 저장용 */-->
	    		<input type="hidden" name="currentShowPageNo"/>  
	    	
	    		<!--/* 정렬기준 저장용 */-->
	    		<input type="hidden" name="cf_sort"/>
	    		
	    	
	    		<!--/* 검색 버튼 */-->
	    		<div class="d-grid mb-4">
	    			<button type="button" id="btn-search" class="btn btn-dark rounded-pill py-2 fw-bold fs-5">검색</button>
	    			
	    		</div>
    		
    		
    		</form>
    		
    		
    	</div>
    	
    	<hr class="mb-4">
    	
    	<!--/* 레시피 결과 영역 */-->
    	<div class="recipe-wrap">
    		
    		<!--/* 총 개수 & 정렬 탭 */-->
    		<div class="recipe-tab-wrap d-flex justify-content-between align-items-center mb-4">
    			<div class="fs-6">
    				총 <span id="total-count" class="fw-bold fs-3" th:text="${totalDataCount}"></span>개의 한식 레시피가 있습니다.
    			</div>
    			
    			<div class="sort-list d-flex gap-2">
    				<input type="radio" class="btn-check" id="sort_view" name="cf_sort" value="조회순" checked>
    				<label class="btn sort-btn" for="sort_view">조회순</label>

    				<input type="radio" class="btn-check" id="sort_recent" name="cf_sort" value="최신순">
    				<label class="btn sort-btn" for="sort_recent">최신순</label>
    			</div>
    		</div>
    		
    		<!--/* 레시피 카드 리스트 (한 줄에 4개) */-->
    		<div class="recipe-content-wrap">
    			<div id="recipe-list" class="row row-cols-1 row-cols-sm-2 row-cols-md-4 g-4">
    				
    				<!--/* 검색 결과가 없다면 */-->		
    				<th:block th:if="${resultMap} == null">
    					검색 결과가 없습니다.
    				</th:block>
    				
    				<!--/* 검색 결과가 있다면	 */-->
    				<th:block th:if="${resultMap} != null">
    				
    					<!--/* 카드 1개 샘플 */-->
    					
	    				<div class="col" th:each="recipe : ${recipeList	}">
	    					<div class="recipe-content">
	    						<div class="recipe-thumb mb-2">
	    							<!--/* 이미지 없을 때 회색 배경으로 */-->
	    							<img src="" alt="" onerror="this.style.display='none'"/>
	    						</div>
	    						
	    						<div class="recipe-caption px-1">
	    							<div class="recipe-caption-title fw-bold mb-2 text-truncate">
	    								<a href="#" class="text-decoration-none text-dark"
	    											th:text="${recipe.r_subject}">요리 제목</a>
	    							</div>
	    							
	    							<div class="recipe-caption-writer mb-2">
	    								<a href="#" class="d-flex align-items-center gap-2 text-decoration-none text-secondary small">
	    									<img class="writer-avatar" src="" alt="" onerror="this.style.visibility='hidden'"/>
	    									<span th:text=${recipe.nickname}>작성자 닉네임</span>
	    								</a>
	    							</div>
	    							
	    							<div class="recipe-caption-rating d-flex align-items-center gap-3 small">
	    								<span class="rating fw-semibold text-dark">
	    									<i class="fa-solid fa-star text-secondary me-1" ></i><span th:text="${recipe.avg_rating}"></span>
	    								</span>
	    								<span class="view-cnt text-muted" th:text="${recipe.r_views}">조회수 100</span>
	    							</div>
	    						</div>
	    					</div>
	    				</div>
	    				<!--/* 카드 1개 샘플 끝 */-->
    					
    					
    				</th:block>
    				
    				
    				
    			</div>
    		</div>
    		
    		
    		
    		
    		<!--/* 페이지바 동적 생성 공간 */-->
    		<nav aria-label="Page navigation" class="my-5">
    			<div id="pageBar" class="d-flex justify-content-center">
    				
    			</div>
    		</nav>
    		
    	</div>
    	
    </div>
</body>
</html>
