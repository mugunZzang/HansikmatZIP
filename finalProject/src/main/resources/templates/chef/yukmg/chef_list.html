<!DOCTYPE html>
<html th:replace="~{layout/kth/layout_main_kth :: layout(~{::title}, ~{::link}, ~{::style}, ~{::script}, ~{::div})}" 
      lang="ko" 
      xmlns:th="http://www.thymeleaf.org"> 
<!-- ::title 은   현재 페이지의 title   태그를 읽어다가 templates/layout/layout_main.html 파일의 th:fragment="layout(title, link, css, script, content)" 에 있는 첫번째 파라미터로 전달한다. -->
<!-- ::link  는   현재 페이지의 link    태그를 읽어다가 templates/layout/layout_main.html 파일의 th:fragment="layout(title, link, css, script, content)" 에 있는 두번째 파라미터로 전달한다. -->
<!-- ::style 은   현재 페이지의 style   태그를 읽어다가 templates/layout/layout_main.html 파일의 th:fragment="layout(title, link, css, script, content)" 에 있는 세번째 파라미터로 전달한다. -->
<!-- ::script 는  현재 페이지의 script  태그를 읽어다가 templates/layout/layout_main.html 파일의 th:fragment="layout(title, link, css, script, content)" 에 있는 네번째 파라미터로 전달한다. -->
<!-- ::div.container 은 현재 페이지의 div.container 태그를 읽어다가 templates/layout/layout_main.html 파일의 th:fragment="layout(title, link, css, script, content)" 에 있는 다섯번째 파라미터로 전달한다. --> 
<!-- 타임리프는 백엔드 서버에서 HTML을 동적으로 렌더링하는 용도로 사용된다. -->

<head>
	<meta charset="UTF-8">
	<title>셰프 목록</title>
	
	<link rel="stylesheet" href="">
	<style type="text/css">
	
		*{
			margin:0;
			padding:0;
		}
		
		a {
			text-decoration:none;
			
		}
		
		.chef-wrap {
			background-color: #ffffff;
			border:1px solid #efefef;
		}
		
			
		.chef-apply a {
			display:flex;
			overflow:hidden;
			height:100px;
			justify-content:center;
			align-items:center;
		}
		
		.chef-apply a img {
			width:100%;
		}
		
		/* 쉐프 하위 탭 메뉴 */
		.chef-tab-second button{
			color:var(--bs-secondary);
			border:none;
			border-bottom:4px solid transparent;
			transition: border-color .4s ease-out,
						color .4s ease-out;						
			border-radius:unset;
		}
			
		.chef-tab-second button:hover {
			color:var(--bs-success);
			border-bottom-color:var(--bs-success);
		}	
		
		.chef-tab-second button.active{
			color:var(--bs-success);
			border-bottom-color:var(--bs-success);
		}
		
		
		/* 랭킹 리스트 */
		.ranking-wrap {
			border-top:1px solid var(--bs-gray-300);
		}
		
		
		ul.ranking-list {
			list-style:none;
			margin:0;
			padding:0;
		}
		
		ul.ranking-list li .ranking-num{
			margin:0 24px;
			
		}
		
		ul.ranking-list li {
			transition:background-color .4s ease-out;
		}
		
		ul.ranking-list li:hover {
			background-color: #F8F9FA;
		}
		
		.profile-zone {
			border-radius:50%;
			overflow:hidden;
			width: 100px;
			height:100px;
			border:3px solid transparent;
			position:relative;
			transition: border-color .4s ease-out;
			flex-shrink: 0;
		}
		
		.profile-zone:hover {
			border-color: #1E3A8A;
		}
		
		.profile-zone .profile-photo {
			 width: 100%;
			 height: 100%;
			 object-fit: cover;
			 transition: transform .4s ease-out;
		}
		
		.profile-zone:hover .profile-photo {
			transform: scale(1.1);
		}
		
		.desc-zone {
			overflow:hidden;
		}
		
		.chef-name:hover {
			text-decoration:underline;
		}
		
		.intro-zone p {
			max-width:800px;
			overflow:hidden;
			white-space:nowrap;
			text-overflow:ellipsis;
		}
		
		.stat-zone ul {
			list-style:none;
			margin:0;
			padding:0;
		}
		
		.stat-zone ul li {
			color:var(--bs-gray-700);
			font-size:14px;
		}
	</style>
	
	<!--/* 
	      자바스크립트 인라인 
	      th:inline="javascript" 은 스크립트 태그 내에서 Thymeleaf 문법([[...]])을 해석할 수 있게 해주는 설정이다.
	      JavaScript 안에서 Thymeleaf 값을 넣을 때는 th:inline="javascript" 와 /*[[뭐뭐뭐]]*/ 구문을 사용해야 한다. 
	*/-->
	<script th:inline="javascript">
	 /*<![CDATA[*/
		 $(document).on("click", ".sub-tab-btn", function() {
		    const tab = $(this).data("tab"); // 'ranking' 또는 'new'
		    location.href = `/hansikmatzip/chef/chef_list?tab=${tab}`;
		});		 
		 
		 $(document).on("click", ".sort-btn", function() {
		    const sortType = $(this).data("sort"); // 'follower', 'views', 'scrap'
		    location.href = `/hansikmatzip/chef/chef_list?tab=ranking&sortType=${sortType}&currentShowPageNo=1`;
		});
	 /*]]>*/	
	</script>
</head>
<body>
  <div class="container chef-wrap rounded p-3">
  	<!--/* 상단 랩 */-->
  	<div class="tit-wrap container-fluid row m-auto px-0">
  		<!--/* 탭 버튼 */-->
  		<div class="nav-wrap col-12 col-lg-9">  			
  			<ul class="nav nav-tabs fw-bold" id="chefTop" role="tablist">
			  <li class="nav-item" role="presentation">
			    <button class="nav-link active" id="chef" data-bs-toggle="tab" data-bs-target="#chef-pane" type="button" role="tab" aria-controls="chef-pane" aria-selected="true">쉐프</button>
			  </li>
			  <li class="nav-item" role="presentation">
			    <button class="nav-link" id="following-chef" data-bs-toggle="tab" data-bs-target="#following-chef-pane" type="button" role="tab" aria-controls="following-chef-pane" aria-selected="false">팔로잉 쉐프</button>
			  </li>
			</ul>
  		</div>
  		<!--/* 검색 바 */-->
  		<div class="search-wrap col-12 col-lg-3">
  			<div class="input-group">
			  <input type="search" class="form-control" placeholder="쉐프 닉네임을 입력해 주세요." aria-label="검색어">
			  <button class="btn btn-primary" type="submit">검색</button>
			</div>
  		</div>		
  	</div>
  	
	<!--/* 쉐프 신청 */-->
	<div class="chef-apply-wrap p-3">
		<div class="chef-apply">
			<a href="#" class="rounded-3">
				<img alt="쉐프 신청 배너" src="https://placehold.co/1920x200" class="">
			</a>
		</div>
	</div>
	
	
	<!-- 탭 콘텐츠 영역 -->
	<div class="tab-content" id="chefTopContent">
	
		<!--/* 쉐프 영역 */-->
		<div class="tab-pane fade show active p-3" id="chef-pane" role="tabpanel" aria-labelledby="chef-tab" tabindex="0">
		
			<div class="btn-group w-100 chef-tab-second"id="chefSubTab" role="group" aria-label="쉐프 탭메뉴">
			  <button type="button" class="btn fs-5 fw-bold sub-tab-btn"
			  			data-tab="ranking"
          				th:classappend="${tab == 'ranking' or tab == null} ? ' active'"
          				role="tab">랭킹</button>
			  <button type="button" class="btn fs-5 fw-bold sub-tab-btn"
						data-tab="new"
			          	th:classappend="${tab == 'new'} ? ' active'"
			          	role="tab">새로운 쉐프</button>
			</div>
			
			<div class="tab-content" id="chefSubTabContent">
				<!-- /* 랭킹 리스트 */ -->
				<div class="tab-pane fade ranking-wrap p-3" id="ranking-pane" role="tabpanel"
         			th:classappend="${tab == 'ranking' or tab == null} ? ' show active'">
					
					<div class="btn-group float-end" role="group" aria-label="정렬 버튼">
					    <button type="button" class="btn btn-sm btn-outline-secondary sort-btn" 
					            data-sort="follower" th:classappend="${sortType == 'follower' or sortType == null} ? ' active'">팔로워순</button>
					    <button type="button" class="btn btn-sm btn-outline-secondary sort-btn" 
					            data-sort="views" th:classappend="${sortType == 'views'} ? ' active'">조회순</button>
					    <button type="button" class="btn btn-sm btn-outline-secondary sort-btn" 
					            data-sort="scrap" th:classappend="${sortType == 'scrap'} ? ' active'">스크랩순</button>
					</div>
					
					
					<ul class="pt-5 ranking-list">
					
						<!-- /* 쉐프 카드 */ -->
						<li th:each="dto, status: ${userDTOList}" class="rounded-3 border p-3 d-flex justify-content-start align-items-center gap-4 mb-3">
							<span class="ranking-num fs-3 fw-semibold" 
								th:text="${(currentShowPageNo - 1) * sizePerPage + status.count}">1</span>
							<div class="profile-zone">
								<a href="#">
									<img alt="프사" th:src="@{/profileimage/{filename}(filename=${dto.profile_sysfilename})}" class="profile-photo">
								</a>								
							</div>
							<div class="desc-zone">
								<div class="name-zone d-flex justify-content-start flex-row align-items-center gap-4">
									<a href="#" class="chef-name">
										<p th:text="${dto.nickname}" class="p-0 m-0 fs-4 fw-bold"></p>
									</a>
									<button class="btn btn-sm btn-primary rounded-pill">팔로우 +</button>
								</div>
								<div class="intro-zone">
									<p th:text="${dto.summary}" class="p-0 m-0 my-2"></p>								
								</div>
								<div class="stat-zone">
									<ul class="d-flex justify-content-start gap-3">
										<li>
											<i class="fa-solid fa-utensils"></i>
											<span th:text="${dto.recipe_count}"></span>
										</li>
										<li>
											<i class="fa-solid fa-scissors"></i>
											<span th:text="${dto.total_scrap_count}"></span>
										</li>
										<li>
											<i class="fa-solid fa-user-plus"></i>
											<span th:text="${dto.follower_count}"></span>
										</li>
										<li>
											<i class="fa-solid fa-eye"></i>
											<span th:text="${dto.total_views}"></span>
										</li>
									</ul>
								</div>
							</div>
						</li>						
					</ul>
					
					<!-- /* 페이지내이션 */ -->
					<nav aria-label="셰프 랭킹 페이지네이션" class="mt-4" th:if="${totalPage > 0}">
					    <ul class="pagination justify-content-center">
					
					        <!-- [맨처음] & [이전 블럭] -->
					        <li class="page-item" th:classappend="${startPage == 1} ? ' disabled'">
					            <a class="page-link" th:href="@{/chef/chef_list(tab=${tab}, sortType=${sortType}, currentShowPageNo=1)}">&laquo;</a>
					        </li>
					        <li class="page-item" th:classappend="${startPage == 1} ? ' disabled'">
					            <a class="page-link" th:href="@{/chef/chef_list(tab=${tab}, sortType=${sortType}, currentShowPageNo=${startPage - 1})}">&lsaquo;</a>
					        </li>
					
					        <!-- 페이지 번호 반복 -->
					        <li class="page-item" 
					            th:each="page : ${#numbers.sequence(startPage, endPage)}"
					            th:classappend="${page == currentShowPageNo} ? ' active'">
					            <a class="page-link" 
					               th:text="${page}" 
					               th:href="@{/chef/chef_list(tab=${tab}, sortType=${sortType}, currentShowPageNo=${page})}">1</a>
					        </li>
					
					        <!-- [다음 블럭] & [맨마지막] -->
					        <li class="page-item" th:classappend="${endPage == totalPage} ? ' disabled'">
					            <a class="page-link" th:href="@{/chef/chef_list(tab=${tab}, sortType=${sortType}, currentShowPageNo=${endPage + 1})}">&rsaquo;</a>
					        </li>
					        <li class="page-item" th:classappend="${endPage == totalPage} ? ' disabled'">
					            <a class="page-link" th:href="@{/chef/chef_list(tab=${tab}, sortType=${sortType}, currentShowPageNo=${totalPage})}">&raquo;</a>
					        </li>
					
					    </ul>
					</nav>					
					<!-- /* 페이지내이션 끝 */ -->
					
				</div>			
				<!-- /* 랭킹 리스트 끝 */ -->
				
				<!-- /* 새로운 쉐프 리스트 */ -->
				<div class="tab-pane fade new-chef-wrap p-3" id="new-chef-pane" role="tabpanel"
			         th:classappend="${tab == 'new'} ? ' show active'">
			        새로운 쉐프 목록이 들어갈 영역입니다.
			    </div>				
				<!-- /* 새로운 쉐프 리스트 끝*/ -->
				
			</div>	
		</div>
	  
		<!--/* 팔로윙 쉐프 영역 */-->
		<div class="tab-pane fade p-3" id="following-chef-pane" role="tabpanel" aria-labelledby="following-chef-tab" tabindex="0">
			팔로윙 쉐프 목록입니다.
		</div>
		
	</div>
	
	
  </div> 
  
</body>
</html>
