plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.2'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.spring'
version = '0.0.1-SNAPSHOT'
description = '한식레시피 프로젝트'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-mail'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'org.thymeleaf.extras:thymeleaf-extras-springsecurity6'
	
	// Spring Boot 4.1.x와 호환되는 마이바티스 스타터 버전 지정
	implementation 'org.mybatis.spring.boot:mybatis-spring-boot-starter:4.1.0'
	
	compileOnly 'org.projectlombok:lombok'
	developmentOnly 'org.springframework.boot:spring-boot-devtools'
	runtimeOnly 'com.oracle.database.jdbc:ojdbc17'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-mail-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-thymeleaf-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testCompileOnly 'org.projectlombok:lombok'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testAnnotationProcessor 'org.projectlombok:lombok'

	annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'
	implementation 'org.springframework.boot:spring-boot-starter-aspectj'
    //implementation 'org.springframework.boot:spring-boot-starter-aspectj:4.1.1'
    
		
	// JSON 관련 라이브러리 추가하기
    implementation 'org.springframework.boot:spring-boot-starter-json'
    implementation 'org.json:json:20260814'
    implementation 'com.googlecode.json-simple:json-simple:1.1.1'
	
	// Gson 관련 라이브러리 추가하기
    implementation 'com.google.code.gson:gson:2.14.0'
	

    // File 업로드 다운로드 관련
    implementation 'commons-io:commons-io:2.22.0'
	
    implementation 'org.apache.poi:poi:5.4.0'
		
    implementation 'org.apache.poi:poi-ooxml:5.4.0'
	
    implementation 'org.apache.xmlbeans:xmlbeans:5.4.0'
	
	// log4j 관련 
	implementation 'org.lazyluke:log4jdbc-remix:0.2.7'
	
	// 이미지 썸네일 생성 라이브러리인 Thumbnailator 라이브러리
    implementation 'net.coobird:thumbnailator:0.4.21'
	
	// AES-256을 사용하여 양방향 암호화/복호화 하기 위한 라이브러리
    implementation 'commons-codec:commons-codec:1.22.1'	
	
	
	// Spring websocket dependency를 추가(#웹채팅관련1)
    implementation 'org.springframework.boot:spring-boot-starter-websocket'
	
		// == JWT(Json Web Token) 생성 및 검증 == //
	// Source: https://mvnrepository.com/artifact/io.jsonwebtoken/jjwt-api
	implementation("io.jsonwebtoken:jjwt-api:0.13.0")
	
	// Source: https://mvnrepository.com/artifact/io.jsonwebtoken/jjwt-impl
	runtimeOnly("io.jsonwebtoken:jjwt-impl:0.13.0")
	
	// Source: https://mvnrepository.com/artifact/io.jsonwebtoken/jjwt-jackson
	runtimeOnly("io.jsonwebtoken:jjwt-jackson:0.13.0")
	
	
	// === Query DSL 에 필요한 것들 ===  
	// 1. SQL 쿼리를 자바코드로 생성해주는 것 
    implementation 'com.querydsl:querydsl-jpa:5.1.0:jakarta'
    
    // 2. QClass(쿼리클래스) 를 생성해주는 것
    /*
       QClass 란? QueryDSL이 Java 코드 기반으로 쿼리를 작성할 수 있게 해주는 핵심 클래스.
       QClass를 사용하여 SQL 대신에 Java 코드로 쿼리를 작성해주는 것이며, 
       동적쿼리(사용자가 입력한 값에 따라 조건이 변하는 쿼리)도 편리하게 작성해준다.
       
       Query DSL 은 엔티티 클래스를 기반으로 Q엔티티명 클래스를 자동생성 해준다.
       예> 엔터티 클래스명이 Member.java 이라면 QMember.java 라는 클래스가 자동생성 된다. 
    */
    annotationProcessor 'com.querydsl:querydsl-apt:5.1.0:jakarta'
    
    // 3. Query DSL 코드생성에 필요한 것들
    annotationProcessor 'jakarta.annotation:jakarta.annotation-api'
    
    // 4. Query DSL 코드생성에 필요한 것들
    annotationProcessor 'jakarta.persistence:jakarta.persistence-api'
    
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	
}

tasks.named('test') {
	useJUnitPlatform()
}

// Java 컴파일러에게 파라미터 이름을 class 파일에 기록하라고 지시
tasks.withType(JavaCompile) {
    options.compilerArgs << "-parameters"
}

// === QClass 관련하여 설정하기 === 
// QClass 파일이(Q엔티티명.java) 생성되는 경로 설정 (최신 Gradle 방식. Gradle 8.x 이상)
def generatedDir = layout.buildDirectory.dir("generated/querydsl").get().asFile 
// layout.buildDirectory 는 프로젝트의 기본 빌드 디렉토리(예: build)를 의미하며, 
// .dir()을 통해 그 하위에 generated/querydsl 경로를 지정함.
/*
   layout.buildDirectory 자체가 빌드 디렉토리 경로(build)를 의미하는 Provider 객체이고, 
   뒤에 붙은 .dir("generated/querydsl")이 하위 경로를 지정하는 역할을 한다.
*/  

// Java Compile Task 설정
tasks.withType(JavaCompile).configureEach {
    // Gradle 8.x 이상 최신 버전 표준 속성 사용
    options.generatedSourceOutputDirectory.set(generatedDir)
}

sourceSets {
    main {
        java {
            srcDirs += generatedDir  // Query DSL 이 자동으로 만든 QClass 파일(Q엔티티명.java) 들도 자바소스 코드의 일부로 인식하도록 추가함.
        }
    }
}

tasks.clean {
    delete generatedDir
}
/*
  다시 build 하거나 clean 할 때 (프로젝트 초기화를 위해 bash 사용시 ./gradlew clean 을 하면 build 디렉토리가 삭제됨) 
  위에서 생성한 QClass 생성경로 설정 폴더도 삭제함으로 QClass 파일들을 삭제함으로 깔끔하게 초기화 시켜줌.
*/

